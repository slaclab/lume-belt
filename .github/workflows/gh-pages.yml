name: Documentation

on:
  pull_request:
  push:
  release:
    types: [ published ]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build docs"
    env:
      SKIP_NOTEBOOKS: |
        docs/examples/run_belt_with_Impact_input.ipynb
      SKIP_NOTEBOOKS_GLOB: |
        docs/examples/lcls-ii-example/*.ipynb

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/conda-setup
        with:
          python-version: ${{ matrix.python-version }}
          extras: "doc"

      - name: Remove unwanted notebooks
        shell: bash -l {0}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          echo "Removing notebooks listed in SKIP_NOTEBOOKS (exact paths)..."
          while IFS= read -r nb; do
            [[ -z "${nb// }" || "${nb:0:1}" == "#" ]] && continue
            if [[ -e "$nb" ]]; then
              echo "  - rm -f $nb"
              rm -f "$nb"
            else
              echo "  - (not found) $nb"
            fi
          done <<< "${SKIP_NOTEBOOKS}"

          echo "Removing notebooks matching SKIP_NOTEBOOKS_GLOB (globs)..."
          while IFS= read -r pattern; do
            [[ -z "${pattern// }" || "${pattern:0:1}" == "#" ]] && continue
            matches=($pattern)
            if (( ${#matches[@]} )); then
              for f in "${matches[@]}"; do
                echo "  - rm -f $f"
                rm -f "$f"
              done
            else
              echo "  - (no match) $pattern"
            fi
          done <<< "${SKIP_NOTEBOOKS_GLOB}"

      - name: Execute notebooks
        shell: bash -l {0}
        run: |
          EXCLUDE_LIST="$(echo "${SKIP_NOTEBOOKS}" | tr '\n' ',' | sed 's/,$//')"
          EXCLUDE_GLOB="$(echo "${SKIP_NOTEBOOKS_GLOB}" | tr '\n' ',' | sed 's/,$//')"
          EXCLUDE_ALL="${EXCLUDE_LIST}${EXCLUDE_GLOB:+,${EXCLUDE_GLOB}}"
          scripts/execute_notebooks.bash --exclude "${EXCLUDE_ALL}"


      - name: Build Docs
        shell: bash -l {0}
        run: mkdocs build

      - name: Extract examples
        shell: bash -l {0}
        run: |
          zip -r lume-belt-examples.zip docs/examples/
          mv lume-belt-examples.zip ./site/assets/

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    if: ${{ github.repository_owner == 'slaclab' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags')) }}
    needs: build
    name: "Deploy docs"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
